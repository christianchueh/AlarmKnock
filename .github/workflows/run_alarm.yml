name: Google Sheet 定時鬧鐘助理

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘自動巡邏一次
  workflow_dispatch: # 允許手動點擊測試

jobs:
  check-sheet-and-alarm:
    runs-on: ubuntu-latest
    steps:
    - name: 🐋 複製程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝必要套件
      run: pip install requests

    - name: ⏰ 執行定時鬧鐘
      env:
        # 🔒 記得去 GitHub 專案的 Settings -> Secrets 設定這兩個變數
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      run: python cron_alarm.py
